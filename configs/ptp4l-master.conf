# Protocol-master base template. These conservative dataset values explicitly
# do NOT claim a high-quality or traceable Grandmaster. A reviewed site/profile
# configuration is required before advertising stronger clock quality.
[global]
serverOnly                  1
time_stamping               hardware
clockClass                  248
clockAccuracy               0xFE
offsetScaledLogVariance     0xFFFF
timeSource                  0xA0
logging_level               6
summary_interval            0
use_syslog                  0
verbose                     1
tx_timestamp_timeout        10
