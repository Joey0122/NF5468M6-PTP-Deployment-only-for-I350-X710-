# Separate phc2sys template for stage 2 clock discipline.
# Data path: synchronized NIC PHC -> phc2sys -> CLOCK_REALTIME.
#
# ptpctl uses automatic mode to follow the port state and selected PHC:
# slave: -a -r  (NIC PHC -> CLOCK_REALTIME)
# master: -a -rr (CLOCK_REALTIME eligible as source -> NIC PHC)
# It does not hard-code ptpX. Domain and transportSpecific are supplied from
# the validated site configuration.

[global]
clock_servo             pi
first_step_threshold    0.00002
step_threshold          0.0
sanity_freq_limit       200000000
logging_level           6
use_syslog              0
verbose                 1

# ptpctl confirms PTP timescale, numeric currentUtcOffset, and
# currentUtcOffsetValid=1 through pmc before slave phc2sys is started.
