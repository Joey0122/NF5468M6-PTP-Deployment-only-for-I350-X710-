# Shared phc2sys servo template. Direction is selected explicitly by ptpctl.
#
# slave system-time mode: -a -r (NIC PHC -> CLOCK_REALTIME)
# slave PHC-only mode: no phc2sys process
# master: -s CLOCK_REALTIME -c <live-interface> (CLOCK_REALTIME -> NIC PHC)
# It does not hard-code ptpX. Domain and transportSpecific are supplied from
# the validated site configuration when automatic slave mode is used.

[global]
clock_servo             pi
first_step_threshold    0.00002
step_threshold          0.0
sanity_freq_limit       200000000
logging_level           6
use_syslog              0
verbose                 1

# ptpctl confirms PTP timescale, numeric currentUtcOffset, and
# currentUtcOffsetValid=1 through pmc before slave phc2sys is started.
